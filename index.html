#indicator {

    width: 4px;

    border-radius: 6px;

}
#search-input:focus {
    border-color: #00ff88;
    box-shadow: 0 0 0 2px rgba(0,255,136,0.2);

    flex: 1;
    padding: 20px;
    overflow-y: auto;
    line-height: 1.45;
    white-space: pre-wrap;
    font-family: 'Courier New', monospace;

.highlight {
    background-color: #00ff88;
    color: #000;
    padding: 1px 3px;
    border-radius: 3px;
}

    padding: 20px;

    margin-bottom: 25px;

}

    padding: 14px;
    margin-bottom: 16px;
    background: #1f1f1f;

    border: 1px solid #444;
    border-radius: 8px;
    font-size: 15px;
    box-sizing: border-box;
}
#message-me textarea {
    min-height: 200px;
    resize: vertical;
}
#message-me button {
    width: 100%;
    padding: 14px;
    background: #00ff88;
    color: #111;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
}
#message-me button:hover {
    background: #00e67a;
    transform: translateY(-1px);
}
#message-me #status {
    margin-top: 20px;
    text-align: center;
    font-weight: bold;
    min-height: 1.5em;
}
button {
    padding: 10px 18px;
    margin: 8px 12px 8px 0;
    background: #1f1f1f;
    color: #eaeaea;
    border: 1px solid #444;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
}
button:hover {
    background: #2a2a2a;
}
button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}
button#startBtn, button#downloadBtn {
    background: #00ff88;
    color: #111;
    border: none;
    font-weight: bold;
}
progress {
    width: 100%;
    height: 20px;
    margin: 16px 0;
}
.hidden { display: none; }

// ==================== FUNCTIONS ====================
const tabsEl = document.getElementById("tabs");
const contentEl = document.getElementById("content");
const indicator = document.getElementById("indicator");
const searchBar = document.getElementById("search-bar");
const searchInput = document.getElementById("search-input");

let currentTerm = "";
let highlights = [];
let currentHighlightIndex = -1;

function moveIndicator(el) {
    indicator.style.top = el.offsetTop + "px";
    indicator.style.height = el.offsetHeight + "px";
}

function escapeHtml(unsafe) {
    return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function performSearch(term) {
    if (!term.trim()) {
        contentEl.innerHTML = `<pre>${escapeHtml(contentEl.dataset.raw || "")}</pre>`;
        highlights = [];
        currentHighlightIndex = -1;
        return;
    }
    if (term === currentTerm) {
        goToNextHighlight();
        return;
    }
    currentTerm = term;
    const rawContent = contentEl.dataset.raw || "";
    let htmlContent = escapeHtml(rawContent);
    const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(escapedTerm, 'gi');
   
    htmlContent = htmlContent.replace(regex, match =>
        `<span class="highlight">${match}</span>`
    );
    contentEl.innerHTML = `<pre>${htmlContent}</pre>`;
    highlights = Array.from(contentEl.querySelectorAll('.highlight'));
    if (highlights.length > 0) {
        currentHighlightIndex = 0;
        highlights[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

function goToNextHighlight() {
    if (highlights.length === 0) return;
    currentHighlightIndex = (currentHighlightIndex + 1) % highlights.length;
    highlights[currentHighlightIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function createTab(key, isMessageMe = false) {
    const div = document.createElement("div");
    div.className = "tab";
    div.textContent = key;
    div.dataset.key = key;
    div.onclick = () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        div.classList.add("active");

        if (isMessageMe) {
            showMessageMe();
        } else if (isVideoExtractor) {
            showVideoExtractor();
        } else {
            const contentText = data[key] || "Content not found";
            contentEl.dataset.raw = contentText;
            contentEl.innerHTML = `<pre>${escapeHtml(contentText)}</pre>`;
            searchBar.style.display = "block";
            searchInput.value = "";
            currentTerm = "";
            highlights = [];
        }
        moveIndicator(div);
    };
    tabsEl.appendChild(div);
    return div;
}

function showMessageMe() {
    searchBar.style.display = "none";
    contentEl.innerHTML = `
<div id="message-me">
    <h2>Message Me</h2>
    <input type="text" id="discordUsername" placeholder="Your discord username">
    <textarea id="messageText" placeholder="Write here what you would like to tell me"></textarea>
    <button id="sendMessageBtn">Send message</button>
    <div id="status"></div>
</div>`;

    const usernameInput = document.getElementById('discordUsername');
    const messageInput = document.getElementById('messageText');
    const sendBtn = document.getElementById('sendMessageBtn');
    const statusEl = document.getElementById('status');

    sendBtn.onclick = async () => {
        const username = usernameInput.value.trim();
        const message = messageInput.value.trim();

        if (!username) {
            statusEl.style.color = '#f88';
            statusEl.textContent = "Send your discord username so I can tell you if I'ved added it or not!!!";
            return;
        }
        if (!message) {
            statusEl.style.color = '#f88';
            statusEl.textContent = "You need to put stuff in the message box...";
            return;
        }

        sendBtn.disabled = true;
        statusEl.style.color = '#ff0';
        statusEl.textContent = "Sending...";

        try {
            const payload = {
                content: `**New message from user "${username}":**\n\n${message}`
            };

            const res = await fetch(URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                statusEl.style.color = '#0f8';
                statusEl.textContent = "Sent!!1!!11!";
                messageInput.value = "";
            } else {
                statusEl.style.color = '#f88';
                statusEl.textContent = "Failed for some reason.";
            }
        } catch (err) {
            statusEl.style.color = '#f88';
            statusEl.textContent = "Connection error.";
            console.error(err);
        }

        sendBtn.disabled = false;
    };
}

// ==================== INIT ====================
Object.keys(data).forEach(key => {
    createTab(key);
});

createTab("Message Me", false, true);

const firstTab = tabsEl.querySelector(".tab");
if (firstTab) firstTab.click();

searchInput.addEventListener('input', e => {
    performSearch(e.target.value.trim());
});
searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        e.preventDefault();
        performSearch(searchInput.value.trim());
    }
});
